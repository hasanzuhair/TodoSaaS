name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore TodoSaaS.sln

    - name: Build Solution
      run: dotnet build TodoSaaS.sln --configuration Release --no-restore

    - name: Run Unit & Integration Tests
      run: dotnet test TodoSaaS.sln --configuration Release --no-build --verbosity normal

    - name: Security Vulnerability Scan (.NET Audit)
      run: dotnet list package --vulnerable --include-transitive

  docker-publish:
    name: Build & Push Docker Image
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish Binaries
      run: dotnet publish -c Release -o TodoSaaS.Api/publish TodoSaaS.Api/TodoSaaS.Api.csproj

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lowercase Repository Name
      run: echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./TodoSaaS.Api
        file: ./TodoSaaS.Api/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.IMAGE_REPOSITORY }}/todosaas-api:latest
          ghcr.io/${{ env.IMAGE_REPOSITORY }}/todosaas-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
