apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: todosaas-api-rollout
  namespace: todosaas
  labels:
    app: todosaas-api
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: todosaas-api
  strategy:
    canary:
      canaryService: todosaas-api-canary
      stableService: todosaas-api-stable
      trafficRouting:
        nginx:
          stableIngress: todosaas-api-ingress
      steps:
        # Step 1: Dark launch / initial canary slice
        - setWeight: 5
        - pause: { duration: 5m }
        # Step 2: Expand to 20% traffic
        - setWeight: 20
        - pause: { duration: 10m }
        # Step 3: Expand to 50% traffic
        - setWeight: 50
        - pause: { duration: 10m }
        # Step 4: Promote to 100% full production traffic
      analysis:
        templates:
          - templateName: success-rate-analysis
        args:
          - name: service-name
            value: todosaas-api-canary
  template:
    metadata:
      labels:
        app: todosaas-api
    spec:
      containers:
        - name: api
          image: ghcr.io/hasanzuhair/todosaas-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-analysis
  namespace: todosaas
spec:
  metrics:
    - name: success-rate
      interval: 1m
      successCondition: result[0] >= 0.999
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_received_total{status!~"5.*"}[2m])) 
            / 
            sum(rate(http_requests_received_total[2m]))
