apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: todosaas
spec:
  provider:
    vault:
      server: "https://vault.internal.corp:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "todosaas-api-role"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: todosaas-api-secrets
  namespace: todosaas
spec:
  refreshInterval: "1h" # Automated rotation polling
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: todosaas-api-credentials
    creationPolicy: Owner
  data:
    - secretKey: PostgresPassword
      remoteRef:
        key: todosaas/database
        property: password
    - secretKey: StripeSecretKey
      remoteRef:
        key: todosaas/stripe
        property: secret_key
    - secretKey: JwtSecret
      remoteRef:
        key: todosaas/auth
        property: jwt_secret
    - secretKey: ZitadelMasterkey
      remoteRef:
        key: todosaas/zitadel
        property: masterkey
