apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todosaas-staging

resources:
  - ../../deployment.yaml
  - ../../external-secret.yaml

namePrefix: staging-

patches:
  - target:
      kind: Deployment
      name: todosaas-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: ASPNETCORE_ENVIRONMENT
            value: "Staging"

images:
  - name: ghcr.io/your-user/todosaas-api
    newName: ghcr.io/hasanzuhair/todosaas-api
    newTag: latest
