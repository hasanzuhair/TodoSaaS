services:
  # 1. Reverse Proxy & Ingress (Caddy with Auto-SSL / Compression / Security Headers)
  caddy:
    image: caddy:2-alpine
    container_name: todosaas-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # 2. ASP.NET Core 9 Web API (Multi-tenant, Minimal APIs)
  api:
    build:
      context: ./TodoSaaS.Api
      dockerfile: Dockerfile
    container_name: todosaas-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseProvider=Postgres
      - UseRedis=true
      - UseRabbitMQ=true
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=todos_db;Username=postgres;Password=localpassword
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Storage__ServiceUrl=http://minio:9000
      - Storage__BucketName=todosaas-files
      - Storage__AccessKey=minioadmin
      - Storage__SecretKey=minioadmin
      - Email__Host=mailpit
      - Email__Port=1025
      - Email__Sender=noreply@todosass.com
      - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started

  # 3. Primary Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: todosaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: todos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Cache & In-Memory Store (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: todosaas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # 5. Message Queue & Event Bus (RabbitMQ with Management UI)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: todosaas-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Web Dashboard
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 6. Object Storage (MinIO S3-Compatible Storage)
  minio:
    image: minio/minio:latest
    container_name: todosaas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - miniodata:/data

  # 7. Transactional Email Catcher (Mailpit - 100% Offline Email Testing)
  mailpit:
    image: axllent/mailpit:latest
    container_name: todosaas-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web Inbox UI

  # 8. Observability: Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: todosaas-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # 9. Observability: Grafana Visual Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: todosaas-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana

  # 10. Self-Hosted Identity & Auth (ZITADEL)
  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.68.2
    container_name: todosaas-zitadel
    restart: unless-stopped
    command: 'start-from-init --masterkey "MasterKeyNeedsToHave32Characters" --tlsMode disabled'
    environment:
      - ZITADEL_DATABASE_POSTGRES_HOST=postgres
      - ZITADEL_DATABASE_POSTGRES_PORT=5432
      - ZITADEL_DATABASE_POSTGRES_DATABASE=zitadel
      - ZITADEL_DATABASE_POSTGRES_USER_USERNAME=postgres
      - ZITADEL_DATABASE_POSTGRES_USER_PASSWORD=localpassword
      - ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE=disable
      - ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME=postgres
      - ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD=localpassword
      - ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE=disable
      - ZITADEL_EXTERNALSECURE=false
      - ZITADEL_EXTERNALPORT=8085
      - ZITADEL_EXTERNALDOMAIN=localhost
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME=admin
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD=Password123!
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED=false
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # 11. Distributed Tracing (OpenTelemetry & Jaeger)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: todosaas-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  pgdata:
  redisdata:
  miniodata:
  grafanadata:
  caddy_data:
  caddy_config:
